<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TG 桥接控制台</title>
<style>
:root {
  --bg:        #0d1117;
  --surface:   #161b22;
  --surface2:  #1c2128;
  --surface3:  #21262d;
  --border:    #2d333b;
  --border2:   #373e47;
  --accent:    #79c0ff;
  --accent2:   #388bfd;
  --accent3:   #1158c7;
  --text:      #cdd9e5;
  --text2:     #adbac7;
  --muted:     #768390;
  --green:     #57ab5a;
  --green2:    #347d39;
  --red:       #e5534b;
  --sent-bg:   #143a6e;
  --recv-bg:   #1c2128;
  --contact-bg:#1a2035;
  --radius-sm: 8px;
  --radius:    14px;
  --radius-lg: 18px;
  --radius-xl: 22px;
  --anim:      180ms cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── 壁纸层 ─────────────────────────────────────────── */
#bg-layer {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 0;
  opacity: 0;
  transition: opacity 1s ease;
}
#bg-layer.loaded { opacity: 1; }
#bg-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13,17,23,0.20);          /* ← 调亮：原来 0.78 → 0.40 */
  backdrop-filter: blur(1px);
  z-index: 1;
}

/* ── 所有主内容在壁纸之上 ─────────────────────────── */
#auth-screen, #app {
  position: relative;
  z-index: 2;
}

/* ── Auth Screen ──────────────────────────────────── */
#auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
}
.auth-card {
  background: rgba(22,27,34,0.52);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xl);
  padding: 38px 30px 32px;
  width: 100%;
  max-width: 400px;
  backdrop-filter: blur(15px);
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
}
.auth-logo { font-size: 2.2rem; margin-bottom: 10px; }
.auth-card h1 { font-size: 1.25rem; margin-bottom: 4px; color: var(--text); font-weight: 700; }
.auth-card p  { color: var(--muted); font-size: .84rem; margin-bottom: 28px; line-height: 1.5; }

.field { margin-bottom: 11px; }
.field label {
  display: block;
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 2px;
  font-weight: 600;
}
.field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 10px 14px;
  font-size: .93rem;
  outline: none;
  transition: border-color var(--anim), box-shadow var(--anim);
}
.field input:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(56,139,253,.18);
}

/* ── 按钮基础 ─────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--accent2);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 18px;
  font-size: .88rem;
  cursor: pointer;
  font-weight: 600;
  transition: background var(--anim), transform 80ms ease, box-shadow var(--anim);
  user-select: none;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 80ms ease;
}
.btn.tap-active::after { background: rgba(255,255,255,.18); }
.btn:hover   { background: var(--accent); box-shadow: 0 4px 14px rgba(56,139,253,.3); }
.btn:active  { transform: scale(.97); }
.btn:disabled{ opacity: .42; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-full    { width: 100%; margin-top: 6px; }
.btn-sm      { padding: 5px 12px; font-size: .76rem; font-weight: 600; border-radius: 8px; }
.btn-red     { background: var(--red); }
.btn-red:hover { background: #f47067; box-shadow: 0 4px 14px rgba(229,83,75,.3); }
.btn-green   { background: var(--green2); color: #d2f4d3; }
.btn-green:hover { background: var(--green); box-shadow: 0 4px 14px rgba(87,171,90,.3); }
.btn-ghost   {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border2);
  font-weight: 500;
}
.btn-ghost:hover { background: var(--surface3); box-shadow: none; color: var(--text); }

.err { color: var(--red); font-size: .82rem; margin-top: 10px; display: none; }

/* ── App Shell ────────────────────────────────────── */
#app {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.app-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: rgba(22,27,34,0.90);
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
  backdrop-filter: blur(2px);
}
.app-header .title { flex: 1; font-size: .94rem; font-weight: 700; color: var(--text); }
.status-dot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: .75rem;
  color: var(--muted);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  box-shadow: 0 0 5px var(--green);
  animation: pulse-dot 2.5s ease infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50%      { opacity: .45; }
}

/* ── Tabs ─────────────────────────────────────────── */
.tabs {
  display: flex;
  background: rgba(22,27,34,0.88);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  backdrop-filter: blur(2px);
}
.tab {
  flex: 1;
  padding: 11px 6px;
  text-align: center;
  font-size: .76rem;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color var(--anim), border-color var(--anim), background var(--anim);
  user-select: none;
  font-weight: 500;
}
.tab:hover { color: var(--text2); background: rgba(255,255,255,.03); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
  background: rgba(56,139,253,.06);
}

.tab-content { display: none; flex: 1; overflow: hidden; }
.tab-content.active {
  display: flex;
  background: rgba(13,17,23,0.35);    /* ← 新增：统一亮度与频道页一致 */
  backdrop-filter: blur(3px);
}

/* ── Chat layout ──────────────────────────────────── */
.chat-layout { display: flex; width: 100%; height: 100%; overflow: hidden; }

.chat-list {
  width: 226px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: rgba(13,17,23,0.35);          /* ← 调亮 + 让壁纸透出：原来 0.70 → 0.45 */
  backdrop-filter: blur(3px);
}
.chat-list::-webkit-scrollbar { width: 4px; }
.chat-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.chat-item {
  padding: 12px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background var(--anim);
}
.chat-item:hover  { background: rgba(255,255,255,.04); }
.chat-item.active {
  background: rgba(56,139,253,.10);
  border-left: 3px solid var(--accent2);
  padding-left: 11px;
}
.avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .76rem;
  font-weight: 700;
  flex-shrink: 0;
  color: #d6eaff;
  letter-spacing: .02em;
}
.avatar-contact {
  background: linear-gradient(135deg, #1e3a5f, #2a5298);
  color: #b8d4ff;
}
.chat-name {
  font-size: .86rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.chat-name-sub {
  font-size: .7rem;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Chat View ────────────────────────────────────── */
.chat-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: rgba(13,17,23,0.35);          /* ← 调亮 + 让壁纸透出：原来 0.55 → 0.35 */
  backdrop-filter: blur(6px);
}
.chat-view-header {
  padding: 10px 14px;
  background: rgba(22,27,34,0.82);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
}
.back-btn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
  border-radius: 6px;
  transition: background var(--anim);
}
.back-btn:hover { background: rgba(56,139,253,.12); }
.chat-view-title { flex: 1; font-weight: 700; font-size: .9rem; color: var(--text); }
.chat-view-sub   { font-size: .7rem; color: var(--muted); }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* 消息气泡 */
.bubble {
  max-width: 76%;
  padding: 8px 13px;
  border-radius: var(--radius);
  font-size: .85rem;
  line-height: 1.55;
  word-break: break-word;
  animation: bubble-in .18s ease;
}
@keyframes bubble-in {
  from { opacity: 0; transform: translateY(4px) scale(.98); }
  to   { opacity: 1; transform: none; }
}
.bubble-sent {
  align-self: flex-end;
  background: var(--sent-bg);
  border-bottom-right-radius: 4px;
  border: 1px solid rgba(56,139,253,.18);
}
.bubble-recv {
  align-self: flex-start;
  background: var(--recv-bg);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.bubble-contact {
  background: var(--contact-bg);
  border-color: rgba(121,192,255,.15);
}
.bubble-from  {
  font-size: .7rem;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 3px;
  opacity: .9;
}
.bubble-text { color: var(--text); }
.bubble-time  {
  font-size: .62rem;
  color: var(--muted);
  text-align: right;
  margin-top: 4px;
  opacity: .75;
}

/* 系统消息 */
.sys-msg {
  align-self: center;
  font-size: .7rem;
  color: var(--muted);
  background: rgba(255,255,255,.05);
  border-radius: 20px;
  padding: 3px 12px;
  margin: 4px 0;
}

.send-bar {
  padding: 9px 12px;
  background: rgba(22,27,34,0.88);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 9px;
  align-items: flex-end;
  flex-shrink: 0;
  backdrop-filter: blur(12px);
}
.send-bar textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  color: var(--text);
  padding: 8px 13px;
  font-size: .87rem;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  outline: none;
  font-family: inherit;
  line-height: 1.48;
  transition: border-color var(--anim), box-shadow var(--anim);
}
.send-bar textarea:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(56,139,253,.14);
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 12px;
  font-size: .9rem;
}
.empty-icon { font-size: 2.8rem; opacity: .6; }

/* ── 频道发布 ────────────────────────────────────── */
.channels-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 200px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.channels-wrap::-webkit-scrollbar { width: 4px; }
.channels-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.ch-section-title {
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 700;
  padding: 2px 2px 0;
}

.ch-intro blockquote {
  background: rgba(56,139,253,.07);
  border-left: 3px solid var(--accent2);
  padding: 10px 14px;
  font-size: .82rem;
  color: var(--text2);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  line-height: 1.5;
  margin: 4px 0 8px 0;
}

.ch-card {
  background: rgba(22,27,34,0.45);         /* ← 从 0.85 → 0.45 */
  border: 1px solid rgba(255,255,255,.10); /* ← 更浅 */
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
  backdrop-filter: blur(4px);
  transition: border-color var(--anim), box-shadow var(--anim);
}
.ch-card:focus-within {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(56,139,253,.10);
}
.ch-card-head {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08); /* 更浅 */
  background: rgba(22,27,34,0.25);                 /* 比卡片主体稍亮 */
}
.ch-card-head .info { flex: 1; min-width: 0; }
.ch-card-head .info strong { display: block; font-size: .87rem; color: var(--text); }
.ch-card-head .info span  { font-size: .71rem; color: var(--muted); }

.badge {
  font-size: .63rem;
  padding: 3px 9px;
  border-radius: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  flex-shrink: 0;
  white-space: nowrap;
}
.badge-green  { background: rgba(87,171,90,.12); color: #57ab5a; border: 1px solid rgba(87,171,90,.35); }
.badge-blue   { background: rgba(56,139,253,.12); color: var(--accent); border: 1px solid rgba(56,139,253,.3); }

.ch-send-area {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ch-send-area textarea {
  width: 100%;
  background: rgba(22,27,34,0.35);        /* ← 从不透明改为浅透明 */
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 13px;
  font-size: .87rem;
  resize: vertical;
  min-height: 86px;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
  transition: border-color var(--anim), box-shadow var(--anim);
}
.ch-send-area textarea:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(56,139,253,.13);
}
.ch-send-btn-row { display: flex; justify-content: flex-end; gap: 8px; }

/* 只监听频道 */
.ch-card-link {
  display: block;
  background: rgba(22,27,34,0.80);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
  text-decoration: none;
  color: inherit;
  transition: border-color var(--anim), background var(--anim), transform var(--anim);
  backdrop-filter: blur(8px);
}
.ch-card-link:hover {
  border-color: var(--accent2);
  background: rgba(56,139,253,.06);
  transform: translateY(-1px);
}
.ch-link-body {
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ch-link-info { flex: 1; min-width: 0; }
.ch-link-info strong { display: block; font-size: .87rem; color: var(--text); }
.ch-link-url  {
  font-size: .71rem;
  color: var(--accent2);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ch-link-hint { font-size: .69rem; color: var(--muted); margin-top: 2px; }
.ch-link-arrow {
  font-size: .95rem;
  color: var(--accent);
  opacity: .3;
  transition: opacity var(--anim), transform var(--anim);
  flex-shrink: 0;
}
.ch-card-link:hover .ch-link-arrow { opacity: 1; transform: translateX(3px); }

/* ── 联系人私聊样式 ───────────────────────────────── */
.contact-header-badge {
  font-size: .68rem;
  color: var(--accent);
  background: rgba(56,139,253,.1);
  border: 1px solid rgba(56,139,253,.22);
  border-radius: 10px;
  padding: 2px 8px;
  font-weight: 600;
}

/* ── Toast ────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(22,27,34,0.95);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: .85rem;
  font-weight: 600;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  white-space: nowrap;
  backdrop-filter: blur(20px);
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast .t-icon { margin-right: 6px; }

/* ── 滚动条全局 ─────────────────────────────────── */
::-webkit-scrollbar       { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── Mobile ─────────────────────────────────────── */
@media (max-width: 580px) {
  .chat-list       { width: 100%; }
  .chat-list.hide  { display: none; }
  .chat-view.hide  { display: none; }
  .back-btn        { display: block !important; }
  .channels-wrap   { padding-bottom: 240px; }
  .ch-send-btn-row { justify-content: stretch; }
  .ch-send-btn-row .btn { width: 100%; }
  .bubble { max-width: 88%; }
}
</style>
</head>

<body>

<!-- 壁纸层 -->
<div id="bg-layer"></div>
<div id="bg-overlay"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🔗</div>
    <h1>TG 桥接控制台</h1>
    <p>输入 Cloudflare Worker 地址和访问密钥</p>
    <div class="field">
      <label>Worker 地址</label>
      <input id="inp-url" type="url" placeholder="https://xxx.workers.dev" autocomplete="off">
    </div>
    <div class="field">
      <label>访问密钥</label>
      <input id="inp-key" type="password" placeholder="输入密钥">
    </div>
    <button class="btn btn-full" id="auth-btn">进入控制台 →</button>
    <div class="err" id="auth-err">连接失败，请检查地址和密钥</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="app-header">
    <span class="title">🔗 TG 桥接控制台</span>
    <span class="status-dot"><span class="dot"></span>运行中</span>
    <button class="btn btn-sm btn-red" id="logout-btn">退出</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="private">🔒 私密群组</div>
    <div class="tab" data-tab="public">🌐 公开群组</div>
    <div class="tab" data-tab="contacts">👤 联系人</div>
    <div class="tab" data-tab="channels">📢 频道</div>
  </div>

  <!-- 私密群组 -->
  <div class="tab-content active" id="tab-private">
    <div class="chat-layout">
      <div class="chat-list" id="list-private"></div>
      <div class="chat-view" id="view-private">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>从左侧选择一个群组</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 公开群组 -->
  <div class="tab-content" id="tab-public">
    <div class="chat-layout">
      <div class="chat-list" id="list-public"></div>
      <div class="chat-view" id="view-public">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>从左侧选择一个群组</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 联系人私聊 -->
  <div class="tab-content" id="tab-contacts">
    <div class="chat-layout">
      <div class="chat-list" id="list-contacts"></div>
      <div class="chat-view" id="view-contacts">
        <div class="empty-state">
          <div class="empty-icon">👤</div>
          <div style="text-align:center;line-height:1.6">
            从左侧选择联系人<br>
            <span style="font-size:.8rem;color:var(--muted)">联系人需先向机器人发送 /start</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 频道发布 -->
  <div class="tab-content" id="tab-channels">
    <div class="channels-wrap" id="channels-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── 全局状态 ─────────────────────────────────────────────
let WORKER = '';
let KEY    = '';
let CFG    = { private: [], public: [], channels: [], contacts: [] };
let timers = {};

// ── 壁纸加载 ─────────────────────────────────────────────
(function initBg() {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
                || window.innerWidth < 768;
  const imgFile = isMobile ? 'f1.jpg' : 'f2.jpg';
  const bg = document.getElementById('bg-layer');
  const img = new Image();
  img.onload = () => {
    bg.style.backgroundImage = `url('${imgFile}')`;
    bg.classList.add('loaded');
  };
  img.src = imgFile;
})();

// ── 工具函数 ─────────────────────────────────────────────
const esc = s => String(s || '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/\n/g, '<br>');

const fmtTime = ts => new Date(ts * 1000)
  .toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

const fmtDate = ts => {
  const d   = new Date(ts * 1000);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtTime(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${fmtTime(ts)}`;
};

const initials = name =>
  name.replace(/[\s（()【[\]】@]/g, '').slice(0, 2).toUpperCase() || '??';

const tgUrl = id => `https://t.me/${String(id).replace(/^@/, '')}`;
const safeId = id => String(id).replace(/[^a-z0-9]/gi, '_');

async function api(path, opts = {}) {
  const r = await fetch(WORKER + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${KEY}`,
      ...(opts.headers || {}),
    },
  });
  return r.json();
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span class="t-icon">${ok ? '✅' : '❌'}</span>${msg}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

// ── 按钮点击动效（短暂变色再执行） ──────────────────────
function tapBtn(btn, cb, delay = 140) {
  if (btn.disabled) return;
  btn.classList.add('tap-active');
  setTimeout(() => {
    btn.classList.remove('tap-active');
    cb();
  }, delay);
}

// ── 鉴权 ─────────────────────────────────────────────────
const savedUrl = localStorage.getItem('wUrl') || '';
if (savedUrl) document.getElementById('inp-url').value = savedUrl;

document.getElementById('inp-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

document.getElementById('auth-btn').addEventListener('click', function() {
  tapBtn(this, async () => {
    const url = document.getElementById('inp-url').value.trim().replace(/\/$/, '');
    const key = document.getElementById('inp-key').value.trim();
    const btn = document.getElementById('auth-btn');
    const err = document.getElementById('auth-err');
    if (!url || !key) { err.textContent = '请填写完整'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = '连接中…'; err.style.display = 'none';
    try {
      const res = await fetch(url + '/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key }),
      });
      const data = await res.json();
      if (data.ok) {
        WORKER = url; KEY = key;
        localStorage.setItem('wUrl', url);
        sessionStorage.setItem('sk', key);
        await boot();
      } else {
        err.textContent = '密钥错误，请重试'; err.style.display = 'block';
      }
    } catch {
      err.textContent = '无法连接 Worker，请检查地址'; err.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = '进入控制台 →';
  });
});

document.getElementById('logout-btn').addEventListener('click', function() {
  tapBtn(this, () => {
    sessionStorage.removeItem('sk');
    Object.values(timers).forEach(clearInterval);
    location.reload();
  });
});

// 自动登录
(async () => {
  const sk = sessionStorage.getItem('sk');
  const wu = localStorage.getItem('wUrl');
  if (sk && wu) { WORKER = wu; KEY = sk; await boot().catch(() => {}); }
})();

// ── 标签切换 ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function() {
  tapBtn(this, () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('tab-' + this.dataset.tab).classList.add('active');
  }, 80);
}));

// ── 初始化 ───────────────────────────────────────────────
async function boot() {
  try {
    CFG = await fetch(WORKER + '/api/config').then(r => r.json());
    if (!CFG.contacts) CFG.contacts = [];
  } catch {}

  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  buildList('list-private',  CFG.private,   'view-private',  'private');
  buildList('list-public',   CFG.public,    'view-public',   'public');
  buildContactList();
  buildChannels();
}

// ── 群组列表 ─────────────────────────────────────────────
function buildList(listId, chats, viewId, type) {
  const list = document.getElementById(listId);
  list.innerHTML = '';
  if (!chats || !chats.length) {
    list.innerHTML = `<div style="padding:20px 14px;color:var(--muted);font-size:.8rem;text-align:center">暂无配置</div>`;
    return;
  }
  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.innerHTML = `
      <div class="avatar">${initials(chat.name)}</div>
      <div>
        <div class="chat-name">${esc(chat.name)}</div>
        <div class="chat-name-sub">${esc(chat.id)}</div>
      </div>`;
    item.addEventListener('click', () => {
      list.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      openChat(listId, viewId, chat, type);
    });
    list.appendChild(item);
  });
}

// ── 联系人列表 ───────────────────────────────────────────
function buildContactList() {
  const list = document.getElementById('list-contacts');
  list.innerHTML = '';
  if (!CFG.contacts || !CFG.contacts.length) {
    list.innerHTML = `
      <div style="padding:18px 14px;color:var(--muted);font-size:.8rem;text-align:center;line-height:1.6">
        暂无联系人<br>在 worker.js 的<br>contacts 中添加
      </div>`;
    return;
  }
  CFG.contacts.forEach(contact => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.innerHTML = `
      <div class="avatar avatar-contact">${initials(contact.name)}</div>
      <div>
        <div class="chat-name">${esc(contact.name)}</div>
        <div class="chat-name-sub">ID: ${esc(contact.id)}</div>
      </div>`;
    item.addEventListener('click', () => {
      list.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      openChat('list-contacts', 'view-contacts', contact, 'contacts');
    });
    list.appendChild(item);
  });
}

// ── 打开聊天窗口 ─────────────────────────────────────────
function openChat(listId, viewId, chat, type) {
  const list = document.getElementById(listId);
  const view = document.getElementById(viewId);
  list.classList.add('hide');
  view.classList.remove('hide');

  if (timers[type]) clearInterval(timers[type]);

  const sid      = safeId(chat.id);
  const isContact = type === 'contacts';
  const subtitle  = isContact ? '私聊联系人' : esc(chat.id);

  view.innerHTML = `
    <div class="chat-view-header">
      <button class="back-btn" onclick="backToList('${listId}','${viewId}')">←</button>
      <div class="avatar ${isContact ? 'avatar-contact' : ''}" style="width:30px;height:30px;font-size:.68rem">
        ${initials(chat.name)}
      </div>
      <div style="flex:1;min-width:0">
        <div class="chat-view-title">${esc(chat.name)}</div>
        <div class="chat-view-sub">${isContact ? '<span class="contact-header-badge">私聊</span>' : subtitle}</div>
      </div>
      <span class="status-dot"><span class="dot"></span>实时</span>
      <button class="btn btn-sm btn-ghost" onclick="clearChat('${chat.id}')">清空</button>
    </div>
    <div class="messages" id="msgs-${sid}">
      <div class="sys-msg">加载消息中…</div>
    </div>
    <div class="send-bar">
      <textarea id="ta-${sid}"
        placeholder="${isContact ? '给 ' + chat.name + ' 发私信…' : '输入消息，Enter 发送，Shift+Enter 换行'}"
        rows="1"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="sendKey(event,'${chat.id}','${sid}')"></textarea>
      <button class="btn" id="sbtn-${sid}" onclick="doSendBtn('${chat.id}','${sid}')">发送</button>
    </div>`;

  fetchMsgs(chat.id);
  timers[type] = setInterval(() => fetchMsgs(chat.id), 5000);
}

function backToList(listId, viewId) {
  document.getElementById(listId).classList.remove('hide');
  document.getElementById(viewId).classList.add('hide');
}

// ── 获取消息（关键修复：无新消息时完全不操作 DOM，彻底解决闪屏） ─────────────────
async function fetchMsgs(chatId) {
  const sid = safeId(chatId);
  const box = document.getElementById('msgs-' + sid);
  if (!box) return;

  try {
    const msgs = await api('/api/messages?chatId=' + encodeURIComponent(chatId));

    let html;
    if (!Array.isArray(msgs) || !msgs.length) {
      html = `<div class="sys-msg">暂无消息 · 确保机器人已加入并关闭隐私模式</div>`;
    } else {
      html = msgs.slice().reverse().map(m => {
        const sent    = (m.from || '').includes('【Web发送】');
        const extra   = !sent && m.from && m.from.includes('(@') ? 'bubble-contact' : '';
        return `<div class="bubble ${sent ? 'bubble-sent' : 'bubble-recv'} ${extra}">
          ${!sent ? `<div class="bubble-from">${esc(m.from)}</div>` : ''}
          <div class="bubble-text">${esc(m.text)}</div>
          <div class="bubble-time">${fmtDate(m.date)}</div>
        </div>`;
      }).join('');
    }

    // 只有内容真正变化时才更新 DOM → 彻底解决每 5 秒闪屏
    if (box.innerHTML !== html) {
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
      box.innerHTML = html;
      if (atBottom || box.scrollHeight < 400) {
        box.scrollTop = box.scrollHeight;
      }
    }
  } catch {}
}

// ── 发送 ─────────────────────────────────────────────────
function sendKey(e, chatId, sid) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doSend(chatId, sid);
  }
}

function doSendBtn(chatId, sid) {
  const btn = document.getElementById('sbtn-' + sid);
  if (!btn) { doSend(chatId, sid); return; }
  tapBtn(btn, () => doSend(chatId, sid));
}

async function doSend(chatId, sid) {
  const ta   = document.getElementById('ta-' + sid);
  const btn  = document.getElementById('sbtn-' + sid);
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const r = await api('/api/send', { method: 'POST', body: JSON.stringify({ chatId, text }) });
    if (r.ok) fetchMsgs(chatId);
    else toast('发送失败: ' + (r.description || '未知错误'), false);
  } catch { toast('网络错误', false); }
  if (btn) { btn.disabled = false; btn.textContent = '发送'; }
}

// ── 清空聊天记录 ─────────────────────────────────────────
async function clearChat(chatId) {
  const sid = safeId(chatId);
  const box = document.getElementById('msgs-' + sid);
  if (!box) return;
  try {
    await api('/api/clear', { method: 'POST', body: JSON.stringify({ chatId }) });
    box.innerHTML = `<div class="sys-msg">消息已清空</div>`;
    toast('已清空本地缓存');
  } catch { toast('清空失败', false); }
}

// ── 频道发布页 ───────────────────────────────────────────
function buildChannels() {
  const wrap = document.getElementById('channels-wrap');
  wrap.innerHTML = '';
  const sendable = (CFG.channels || []).filter(c => c.canSend);
  const readonly = (CFG.channels || []).filter(c => !c.canSend);

  if (sendable.length) {
    appendSectionTitle(wrap, '📤 可发布频道');
    sendable.forEach(ch => {
      const sid  = safeId(ch.id);
      const card = document.createElement('div');
      card.className = 'ch-card';
      card.innerHTML = `
        <div class="ch-card-head">
          <div class="avatar" style="background:rgba(87,171,90,.15);color:var(--green);font-size:1rem;width:36px;height:36px">📢</div>
          <div class="info">
            <strong>${esc(ch.name)}</strong>
            <span>${esc(ch.id)}</span>
          </div>
          <span class="badge badge-green">可发布</span>
        </div>
        <div class="ch-send-area">
          <textarea id="cht-${sid}" placeholder="输入要发布到「${esc(ch.name)}」的内容…"></textarea>
          <div class="ch-send-btn-row">
            <button class="btn btn-ghost btn-sm" onclick="clearChTA('${sid}')">清空</button>
            <button class="btn btn-green" id="csbtn-${sid}" onclick="sendChBtn('${ch.id}','${sid}')">
              📤 发布到频道
            </button>
          </div>
        </div>`;
      wrap.appendChild(card);
    });
  }

  if (readonly.length) {
    const t = appendSectionTitle(wrap, '📡 其他关注频道（点击打开）');
    if (sendable.length) t.style.marginTop = '18px';
    const intro = document.createElement('div');
    intro.className = 'ch-intro';
    intro.innerHTML = `<blockquote>在网址 t.me/ 后添加 s/ 可在网页端查看频道内容</blockquote>`;
    wrap.appendChild(intro);

    readonly.forEach(ch => {
      const url = tgUrl(ch.id);
      const a   = document.createElement('a');
      a.className = 'ch-card-link';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="ch-link-body">
          <div class="avatar" style="background:var(--surface2);font-size:1rem;width:36px;height:36px">📡</div>
          <div class="ch-link-info">
            <strong>${esc(ch.name)}</strong>
            <div class="ch-link-url">${esc(url)}</div>
            <div class="ch-link-hint">点击在 Telegram 网页端查看</div>
          </div>
          <div class="ch-link-arrow">→</div>
        </div>`;
      wrap.appendChild(a);
    });
  }

  if (!sendable.length && !readonly.length) {
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.style.paddingTop = '60px';
    e.innerHTML = `<div class="empty-icon">📢</div><div>暂无配置频道</div>`;
    wrap.appendChild(e);
  }
}

function appendSectionTitle(wrap, text) {
  const t = document.createElement('div');
  t.className = 'ch-section-title';
  t.textContent = text;
  wrap.appendChild(t);
  return t;
}

function clearChTA(sid) {
  const ta = document.getElementById('cht-' + sid);
  if (ta) ta.value = '';
}

function sendChBtn(chatId, sid) {
  const btn = document.getElementById('csbtn-' + sid);
  if (!btn) { sendCh(chatId, sid); return; }
  tapBtn(btn, () => sendCh(chatId, sid));
}

async function sendCh(chatId, sid) {
  const ta  = document.getElementById('cht-' + sid);
  const btn = document.getElementById('csbtn-' + sid);
  const text = ta ? ta.value.trim() : '';
  if (!text) { toast('请输入发布内容', false); return; }
  if (btn) { btn.disabled = true; btn.textContent = '发送中…'; }
  try {
    const r = await api('/api/send', { method: 'POST', body: JSON.stringify({ chatId, text }) });
    if (r.ok) { if (ta) ta.value = ''; toast('已成功发布到频道'); }
    else toast('发布失败: ' + (r.description || '未知'), false);
  } catch { toast('网络错误', false); }
  if (btn) { btn.disabled = false; btn.textContent = '📤 发布到频道'; }
}
</script>
