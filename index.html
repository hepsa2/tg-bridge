<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TG 桥接控制台</title>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #21262d;
  --border:   #30363d;
  --accent:   #58a6ff;
  --accent2:  #1f6feb;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --green:    #3fb950;
  --red:      #f85149;
  --sent-bg:  #0d419d;
  --recv-bg:  #21262d;
  --radius:   10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Auth Screen ─────────────────── */
#auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
}
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
}
.auth-logo { font-size: 2.5rem; margin-bottom: 8px; }
.auth-card h1 { font-size: 1.3rem; margin-bottom: 4px; }
.auth-card p  { color: var(--muted); font-size: .85rem; margin-bottom: 28px; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: .72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 14px;
  font-size: .95rem;
  outline: none;
  transition: border-color .2s;
}
.field input:focus { border-color: var(--accent); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--accent2);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: .9rem;
  cursor: pointer;
  font-weight: 600;
  transition: opacity .15s, background .15s;
}
.btn:hover   { background: var(--accent); }
.btn:disabled{ opacity: .4; cursor: not-allowed; }
.btn-full  { width: 100%; margin-top: 4px; }
.btn-sm    { padding: 5px 12px; font-size: .78rem; font-weight: 500; }
.btn-red   { background: var(--red); }
.btn-green { background: var(--green); color: #000; }
.btn-green:hover { background: #52d667; }
.err { color: var(--red); font-size: .82rem; margin-top: 10px; display: none; }

/* ── App Shell ───────────────────── */
#app {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.app-header {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}
.app-header .title { flex: 1; font-size: .95rem; font-weight: 700; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  margin-right: 4px;
}

/* ── Tabs ────────────────────────── */
.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 10px 6px;
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
  user-select: none;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.tab-content { display: none; flex: 1; overflow: hidden; }
.tab-content.active { display: flex; }

/* ── Chat layout ─────────────────── */
.chat-layout { display: flex; width: 100%; height: 100%; overflow: hidden; }

.chat-list {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--surface);
}
.chat-item {
  padding: 12px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background .15s;
}
.chat-item:hover  { background: var(--surface2); }
.chat-item.active {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding-left: 11px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .78rem;
  font-weight: 700;
  flex-shrink: 0;
}
.chat-name { font-size: .88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-view { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.chat-view-header {
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.back-btn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-size: 1.3rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.chat-view-title { flex: 1; font-weight: 700; font-size: .9rem; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bubble {
  max-width: 78%;
  padding: 7px 11px;
  border-radius: 12px;
  font-size: .86rem;
  line-height: 1.5;
  word-break: break-word;
}
.bubble-sent  { align-self: flex-end; background: var(--sent-bg); border-bottom-right-radius: 3px; }
.bubble-recv  { align-self: flex-start; background: var(--recv-bg); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
.bubble-from  { font-size: .72rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
.bubble-time  { font-size: .65rem; color: var(--muted); text-align: right; margin-top: 3px; }

.send-bar {
  padding: 8px 10px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.send-bar textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 8px 12px;
  font-size: .88rem;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  outline: none;
  font-family: inherit;
  line-height: 1.45;
}
.send-bar textarea:focus { border-color: var(--accent); }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 10px;
  font-size: .9rem;
}
.empty-icon { font-size: 3rem; }

/* ══ 频道发布页面 ══════════════════════════════════════════ */
/*
  关键修复（2026-04-05）：
  1. padding-bottom 增大到 220px（移动端 260px），彻底解决最后一张「可发布」卡片的「发布到频道」按钮被下方「其他关注频道」栏目遮挡的问题
  2. ch-card 保持 overflow: visible
  3. 可发布卡片和只读卡片之间增加更明显的视觉间距（readonly 标题 margin-top 改为 20px）
  4. 只读频道卡片已使用 <a> 标签 + target="_blank"，点击即可自动跳转到对应频道的 Telegram 网页版（https://t.me/xxx）
*/
.channels-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 14px 220px; /* 大幅增加底部留白，确保最后一张卡的按钮完整露出 */
  display: flex;
  flex-direction: column;
  gap: 16px; /* 卡片之间间距略微增大，提升视觉呼吸感 */
}

.ch-section-title {
  font-size: .72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  padding: 2px 2px 0;
}

/* 可发布频道卡片 */
.ch-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: visible; /* 不裁剪，防止按钮被遮 */
  flex-shrink: 0;
}
.ch-card-head {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.ch-card-head .info { flex: 1; min-width: 0; }
.ch-card-head .info strong { display: block; font-size: .88rem; }
.ch-card-head .info span  { font-size: .72rem; color: var(--muted); }

.badge {
  font-size: .65rem;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 700;
  text-transform: uppercase;
  flex-shrink: 0;
  white-space: nowrap;
}
.badge-green { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.4); }

/* 输入区：竖排，按钮在输入框下方，独立成行 */
.ch-send-area {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ch-send-area textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: .88rem;
  resize: vertical;
  min-height: 90px;
  outline: none;
  font-family: inherit;
  line-height: 1.5;
}
.ch-send-area textarea:focus { border-color: var(--accent); }
/* 按钮行：靠右对齐，确保完整显示 */
.ch-send-btn-row {
  display: flex;
  justify-content: flex-end;
}

/* 仅监控频道：整体可点击的链接卡片（已实现点击跳转 Telegram 网页） */
.ch-card-link {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
  text-decoration: none;
  color: inherit;
  transition: border-color .2s, background .15s;
  cursor: pointer;
}
.ch-card-link:hover {
  border-color: var(--accent);
  background: var(--surface2);
}
.ch-card-link:hover .ch-link-arrow {
  opacity: 1;
  transform: translateX(3px);
}
.ch-link-body {
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ch-link-info { flex: 1; min-width: 0; }
.ch-link-info strong { display: block; font-size: .88rem; line-height: 1.35; }
.ch-link-url {
  font-size: .72rem;
  color: var(--accent);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ch-link-hint {
  font-size: .7rem;
  color: var(--muted);
  margin-top: 2px;
}
.ch-link-arrow {
  font-size: 1rem;
  color: var(--accent);
  opacity: .35;
  transform: translateX(0);
  transition: opacity .2s, transform .2s;
  flex-shrink: 0;
}

/* ── Toast ───────────────────────── */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #000;
  padding: 9px 20px;
  border-radius: 8px;
  font-size: .88rem;
  font-weight: 600;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ── Mobile ──────────────────────── */
@media (max-width: 580px) {
  .chat-list { width: 100%; }
  .chat-list.hide { display: none; }
  .chat-view.hide { display: none; }
  .back-btn { display: block; }
  .channels-wrap { padding-bottom: 260px; } /* 移动端留更大底部空间 */
  .ch-send-btn-row { justify-content: stretch; }
  .ch-send-btn-row .btn { width: 100%; }
}
</style>
</head>
<body>

<!-- ══ AUTH SCREEN ══════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🔗</div>
    <h1>TG 桥接控制台</h1>
    <p>输入 Cloudflare Worker 地址和访问密钥</p>

    <div class="field">
      <label>Worker 地址</label>
      <input id="inp-url" type="url" placeholder="https://xxx.workers.dev" autocomplete="off">
    </div>
    <div class="field">
      <label>访问密钥</label>
      <input id="inp-key" type="password" placeholder="输入密钥">
    </div>
    <button class="btn btn-full" id="auth-btn">进入控制台 →</button>
    <div class="err" id="auth-err">连接失败，请检查地址和密钥</div>
  </div>
</div>

<!-- ══ MAIN APP ════════════════════════════════════════ -->
<div id="app">
  <div class="app-header">
    <span class="title">🔗 TG 桥接控制台</span>
    <span style="font-size:.78rem;color:var(--muted)"><span class="dot"></span>运行中</span>
    <button class="btn btn-sm btn-red" id="logout-btn">退出</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="private">🔒 私密群组</div>
    <div class="tab" data-tab="public">🌐 公开群组</div>
    <div class="tab" data-tab="channels">📢 频道发布</div>
  </div>

  <!-- ── 私密群组 ── -->
  <div class="tab-content active" id="tab-private">
    <div class="chat-layout">
      <div class="chat-list" id="list-private"></div>
      <div class="chat-view"  id="view-private">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>从左侧选择一个群组</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 公开群组 ── -->
  <div class="tab-content" id="tab-public">
    <div class="chat-layout">
      <div class="chat-list" id="list-public"></div>
      <div class="chat-view"  id="view-public">
        <div class="empty-state">
          <div class="empty-icon">💬</div>
          <div>从左侧选择一个群组</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 频道发布 ── -->
  <div class="tab-content" id="tab-channels">
    <div class="channels-wrap" id="channels-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── 全局状态 ──────────────────────────────────────────────
let WORKER = '';
let KEY    = '';
let CFG    = { private: [], public: [], channels: [] };
let timers = {};

// ── 工具 ──────────────────────────────────────────────────
const esc = s => String(s||'')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/\n/g,'<br>');

const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const initials = name => name.replace(/[\s（()【[\]】]/g,'').slice(0,2).toUpperCase() || '??';

// @username 或 @xxx → https://t.me/xxx
const tgUrl = id => `https://t.me/${String(id).replace(/^@/,'')}`;

async function api(path, opts = {}) {
  const r = await fetch(WORKER + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${KEY}`,
      ...(opts.headers || {}),
    },
  });
  return r.json();
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? 'var(--green)' : 'var(--red)';
  el.style.color = ok ? '#000' : '#fff';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

// ── 鉴权 ──────────────────────────────────────────────────
const savedUrl = localStorage.getItem('wUrl') || '';
if (savedUrl) document.getElementById('inp-url').value = savedUrl;

document.getElementById('inp-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

document.getElementById('auth-btn').addEventListener('click', async () => {
  const url = document.getElementById('inp-url').value.trim().replace(/\/$/,'');
  const key = document.getElementById('inp-key').value.trim();
  const btn = document.getElementById('auth-btn');
  const err = document.getElementById('auth-err');

  if (!url || !key) { err.textContent = '请填写完整'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '连接中…'; err.style.display = 'none';
  try {
    const res = await fetch(url + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    const data = await res.json();
    if (data.ok) {
      WORKER = url; KEY = key;
      localStorage.setItem('wUrl', url);
      sessionStorage.setItem('sk', key);
      await boot();
    } else {
      err.textContent = '密钥错误，请重试'; err.style.display = 'block';
    }
  } catch {
    err.textContent = '无法连接 Worker，请检查地址'; err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = '进入控制台 →';
});

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('sk');
  Object.values(timers).forEach(clearInterval);
  location.reload();
});

// 自动登录
(async () => {
  const sk = sessionStorage.getItem('sk');
  const wu = localStorage.getItem('wUrl');
  if (sk && wu) { WORKER = wu; KEY = sk; await boot().catch(() => {}); }
})();

// ── 标签切换 ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('tab-' + t.dataset.tab).classList.add('active');
}));

// ── 初始化 ────────────────────────────────────────────────
async function boot() {
  try {
    CFG = await fetch(WORKER + '/api/config').then(r => r.json());
  } catch {}

  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  buildList('list-private', CFG.private, 'view-private', 'private');
  buildList('list-public',  CFG.public,  'view-public',  'public');
  buildChannels();
}

// ── 群组列表 ──────────────────────────────────────────────
function buildList(listId, chats, viewId, type) {
  const list = document.getElementById(listId);
  list.innerHTML = '';
  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.innerHTML = `<div class="avatar">${initials(chat.name)}</div>
                      <div class="chat-name">${esc(chat.name)}</div>`;
    item.addEventListener('click', () => {
      list.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      openChat(listId, viewId, chat, type);
    });
    list.appendChild(item);
  });
}

function openChat(listId, viewId, chat, type) {
  const list = document.getElementById(listId);
  const view = document.getElementById(viewId);
  list.classList.add('hide');
  view.classList.remove('hide');

  if (timers[type]) clearInterval(timers[type]);

  const sid = safeId(chat.id);
  view.innerHTML = `
    <div class="chat-view-header">
      <button class="back-btn" onclick="backToList('${listId}','${viewId}')">←</button>
      <div class="chat-view-title">${esc(chat.name)}</div>
      <span style="font-size:.72rem;color:var(--muted)"><span class="dot"></span>实时</span>
    </div>
    <div class="messages" id="msgs-${sid}">
      <div style="color:var(--muted);font-size:.82rem;text-align:center;padding:20px">加载中…</div>
    </div>
    <div class="send-bar">
      <textarea id="ta-${sid}" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        onkeydown="sendKey(event,'${chat.id}')"></textarea>
      <button class="btn" onclick="doSend('${chat.id}')">发送</button>
    </div>`;

  fetchMsgs(chat.id);
  timers[type] = setInterval(() => fetchMsgs(chat.id), 5000);
}

function backToList(listId, viewId) {
  document.getElementById(listId).classList.remove('hide');
  document.getElementById(viewId).classList.add('hide');
}

// ── 消息加载 ──────────────────────────────────────────────
async function fetchMsgs(chatId) {
  const box = document.getElementById('msgs-' + safeId(chatId));
  if (!box) return;
  try {
    const msgs = await api('/api/messages?chatId=' + encodeURIComponent(chatId));
    if (!Array.isArray(msgs) || !msgs.length) {
      box.innerHTML = '<div style="color:var(--muted);font-size:.82rem;text-align:center;padding:20px">暂无消息。确保机器人已加入群组并关闭隐私模式。</div>';
      return;
    }
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
    box.innerHTML = msgs.slice().reverse().map(m => {
      const sent = (m.from || '').includes('【Web发送】');
      return `<div class="bubble ${sent ? 'bubble-sent' : 'bubble-recv'}">
        ${!sent ? `<div class="bubble-from">${esc(m.from)}</div>` : ''}
        <div class="bubble-text">${esc(m.text)}</div>
        <div class="bubble-time">${fmtTime(m.date)}</div>
      </div>`;
    }).join('');
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch {}
}

// ── 发送消息 ──────────────────────────────────────────────
function sendKey(e, chatId) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(chatId); }
}

async function doSend(chatId) {
  const ta = document.getElementById('ta-' + safeId(chatId));
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  try {
    const r = await api('/api/send', { method:'POST', body: JSON.stringify({ chatId, text }) });
    if (r.ok) fetchMsgs(chatId);
    else toast('❌ 发送失败: ' + (r.description || '未知错误'), false);
  } catch { toast('❌ 网络错误', false); }
}

// ── 频道发布页面 ──────────────────────────────────────────
function buildChannels() {
  const wrap = document.getElementById('channels-wrap');
  wrap.innerHTML = '';

  const sendable = CFG.channels.filter(c => c.canSend);
  const readonly = CFG.channels.filter(c => !c.canSend);

  // ── 可发布频道 ──────────────────────────────────────────
  if (sendable.length) {
    const t = document.createElement('div');
    t.className = 'ch-section-title';
    t.textContent = '📤 可发布频道';
    wrap.appendChild(t);

    sendable.forEach(ch => {
      const sid = safeId(ch.id);
      const card = document.createElement('div');
      card.className = 'ch-card';
      card.innerHTML = `
        <div class="ch-card-head">
          <div class="avatar" style="background:rgba(63,185,80,.15);color:var(--green);font-size:1rem">📢</div>
          <div class="info">
            <strong>${esc(ch.name)}</strong>
            <span>${esc(ch.id)}</span>
          </div>
          <span class="badge badge-green">可发布</span>
        </div>
        <div class="ch-send-area">
          <textarea id="cht-${sid}" placeholder="输入要发布到「${esc(ch.name)}」的内容…"></textarea>
          <div class="ch-send-btn-row">
            <button class="btn btn-green" id="sbtn-${sid}" onclick="sendCh('${ch.id}','${sid}')">
              📤 发布到频道
            </button>
          </div>
        </div>`;
      wrap.appendChild(card);
    });
  }

  // ── 仅监控频道（整体可点击，自动跳转 Telegram 网页版） ────────
  if (readonly.length) {
    const t = document.createElement('div');
    t.className = 'ch-section-title';
    t.style.marginTop = sendable.length ? '20px' : '0';   /* 增大分隔间距 */
    t.textContent = '📡 其他关注频道（点击打开）';
    wrap.appendChild(t);

    readonly.forEach(ch => {
      const url = tgUrl(ch.id);
      const a = document.createElement('a');
      a.className = 'ch-card-link';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="ch-link-body">
          <div class="avatar" style="background:var(--surface2);font-size:1rem">📡</div>
          <div class="ch-link-info">
            <strong>${esc(ch.name)}</strong>
            <div class="ch-link-url">${esc(url)}</div>
            <div class="ch-link-hint">点击在 Telegram 网页端查看频道</div>
          </div>
          <div class="ch-link-arrow">→</div>
        </div>`;
      wrap.appendChild(a);
    });
  }

  // 如果没有任何频道，显示提示
  if (!sendable.length && !readonly.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.style.paddingTop = '60px';
    empty.innerHTML = `<div class="empty-icon">📢</div><div>暂无配置频道</div>`;
    wrap.appendChild(empty);
  }
}

// ── 发布到频道 ────────────────────────────────────────────
async function sendCh(chatId, sid) {
  const ta  = document.getElementById('cht-' + sid);
  const btn = document.getElementById('sbtn-' + sid);
  const text = ta.value.trim();
  if (!text) { toast('⚠️ 请输入发布内容', false); return; }

  btn.disabled = true;
  btn.textContent = '发送中…';
  try {
    const r = await api('/api/send', { method:'POST', body: JSON.stringify({ chatId, text }) });
    if (r.ok) { ta.value = ''; toast('✅ 已成功发布到频道'); }
    else toast('❌ 发布失败: ' + (r.description || '未知'), false);
  } catch {
    toast('❌ 网络错误', false);
  }
  btn.disabled = false;
  btn.textContent = '📤 发布到频道';
}

// ── 工具函数 ──────────────────────────────────────────────
const safeId = id => String(id).replace(/[^a-z0-9]/gi, '_');
</script>
