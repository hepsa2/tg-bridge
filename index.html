<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TG 桥接控制台</title>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #21262d;
  --border:   #30363d;
  --accent:   #58a6ff;
  --accent2:  #1f6feb;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --green:    #3fb950;
  --red:      #f85149;
  --sent-bg:  #0d419d;
  --recv-bg:  #21262d;
  --radius:   10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Auth Screen */
#auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
}
.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  width: 100%;
  max-width: 400px;
}
.auth-logo { font-size: 2.5rem; margin-bottom: 8px; }
.auth-card h1 { font-size: 1.3rem; margin-bottom: 4px; }
.auth-card p  { color: var(--muted); font-size: .85rem; margin-bottom: 28px; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: .72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 14px;
  font-size: .95rem;
  outline: none;
  transition: border-color .2s;
}
.field input:focus { border-color: var(--accent); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--accent2);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: .9rem;
  cursor: pointer;
  font-weight: 600;
  transition: opacity .15s, background .15s;
}
.btn:hover   { background: var(--accent); }
.btn:disabled{ opacity: .4; cursor: not-allowed; }
.btn-full  { width: 100%; margin-top: 4px; }
.btn-sm    { padding: 5px 12px; font-size: .78rem; font-weight: 500; }
.btn-red   { background: var(--red); }
.btn-green { background: var(--green); color: #000; }
.btn-green:hover { background: #52d667; }
.err { color: var(--red); font-size: .82rem; margin-top: 10px; display: none; }

/* App Shell */
#app {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}
.app-header {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 10px;
  flex-shrink: 0;
}
.app-header .title { flex: 1; font-size: .95rem; font-weight: 700; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
  margin-right: 4px;
}

/* Tabs */
.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 10px 6px;
  text-align: center;
  font-size: .78rem;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
  user-select: none;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

.tab-content { display: none; flex: 1; overflow: hidden; }
.tab-content.active { display: flex; }

/* Chat layout */
.chat-layout { display: flex; width: 100%; height: 100%; overflow: hidden; }
.chat-list {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--surface);
}
.chat-item {
  padding: 12px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background .15s;
}
.chat-item:hover  { background: var(--surface2); }
.chat-item.active {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding-left: 11px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .78rem;
  font-weight: 700;
  flex-shrink: 0;
}
.chat-name { font-size: .88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-view { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.chat-view-header {
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.back-btn {
  display: none;
  background: none;
  border: none;
  color: var(--accent);
  font-size: 1.3rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.chat-view-title { flex: 1; font-weight: 700; font-size: .9rem; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bubble {
  max-width: 78%;
  padding: 7px 11px;
  border-radius: 12px;
  font-size: .86rem;
  line-height: 1.5;
  word-break: break-word;
}
.bubble-sent  { align-self: flex-end; background: var(--sent-bg); border-bottom-right-radius: 3px; }
.bubble-recv  { align-self: flex-start; background: var(--recv-bg); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
.bubble-from  { font-size: .72rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
.bubble-time  { font-size: .65rem; color: var(--muted); text-align: right; margin-top: 3px; }

.send-bar {
  padding: 8px 10px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.send-bar textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 8px 12px;
  font-size: .88rem;
  resize: none;
  min-height: 38px;
  max-height: 110px;
  outline: none;
  font-family: inherit;
  line-height: 1.45;
}
.send-bar textarea:focus { border-color: var(--accent); }

/* 频道发布页面 - 已优化 */
.channels-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 280px;   /* 进一步增加底部留白，防止按钮被遮挡 */
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.ch-section-title {
  font-size: .72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  padding: 4px 2px;
}

/* 新增：频道介绍文字样式 */
.ch-intro {
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.5;
  padding: 0 4px 12px;
  border-left: 3px solid var(--accent2);
  margin: 4px 0 16px 0;
}

/* 可发布频道卡片 */
.ch-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: visible;
}
.ch-card-head {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.ch-card-head .info { flex: 1; }
.ch-card-head .info strong { display: block; font-size: .88rem; }
.ch-card-head .info span { font-size: .72rem; color: var(--muted); }

.badge-green {
  font-size: .65rem;
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(63,185,80,.15);
  color: var(--green);
  border: 1px solid rgba(63,185,80,.4);
}

.ch-send-area {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ch-send-area textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 12px;
  font-size: .88rem;
  resize: vertical;
  min-height: 90px;
}
.ch-send-btn-row {
  display: flex;
  justify-content: flex-end;
}

/* 仅监控频道卡片 */
.ch-card-link {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  transition: all .2s;
}
.ch-card-link:hover {
  border-color: var(--accent);
  background: var(--surface2);
}
.ch-link-body {
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.ch-link-info { flex: 1; }
.ch-link-info strong { display: block; font-size: .88rem; }
.ch-link-url { font-size: .72rem; color: var(--accent); margin-top: 2px; }
.ch-link-hint { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.ch-link-arrow {
  font-size: 1.2rem;
  color: var(--accent);
  opacity: 0.4;
  transition: all .2s;
}
.ch-card-link:hover .ch-link-arrow {
  opacity: 1;
  transform: translateX(4px);
}

/* Toast */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--green);
  color: #000;
  padding: 9px 20px;
  border-radius: 8px;
  font-size: .88rem;
  font-weight: 600;
  z-index: 9999;
  opacity: 0;
  transition: opacity .3s;
}
#toast.show { opacity: 1; }

@media (max-width: 580px) {
  .channels-wrap { padding-bottom: 320px; }
  .ch-send-btn-row .btn { width: 100%; }
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🔗</div>
    <h1>TG 桥接控制台</h1>
    <p>输入 Cloudflare Worker 地址和访问密钥</p>

    <div class="field">
      <label>Worker 地址</label>
      <input id="inp-url" type="url" placeholder="https://xxx.workers.dev">
    </div>
    <div class="field">
      <label>访问密钥</label>
      <input id="inp-key" type="password" placeholder="输入密钥">
    </div>
    <button class="btn btn-full" id="auth-btn">进入控制台 →</button>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div class="app-header">
    <span class="title">🔗 TG 桥接控制台</span>
    <span style="font-size:.78rem;color:var(--muted)"><span class="dot"></span>运行中</span>
    <button class="btn btn-sm btn-red" id="logout-btn">退出</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="private">🔒 私密群组</div>
    <div class="tab" data-tab="public">🌐 公开群组</div>
    <div class="tab" data-tab="channels">📢 频道发布</div>
  </div>

  <div class="tab-content active" id="tab-private">
    <div class="chat-layout">
      <div class="chat-list" id="list-private"></div>
      <div class="chat-view" id="view-private">
        <div class="empty-state"><div class="empty-icon">💬</div><div>从左侧选择一个群组</div></div>
      </div>
    </div>
  </div>

  <div class="tab-content" id="tab-public">
    <div class="chat-layout">
      <div class="chat-list" id="list-public"></div>
      <div class="chat-view" id="view-public">
        <div class="empty-state"><div class="empty-icon">💬</div><div>从左侧选择一个群组</div></div>
      </div>
    </div>
  </div>

  <div class="tab-content" id="tab-channels">
    <div class="channels-wrap" id="channels-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// 全局变量和工具函数（保持不变）
let WORKER = '';
let KEY    = '';
let CFG    = { private: [], public: [], channels: [] };

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const tgUrl = id => `https://t.me/${String(id).replace(/^@/,'')}`;
const safeId = id => String(id).replace(/[^a-z0-9]/gi, '_');

async function api(path, opts = {}) {
  const r = await fetch(WORKER + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${KEY}` }
  });
  return r.json();
}

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? 'var(--green)' : 'var(--red)';
  el.style.color = ok ? '#000' : '#fff';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

// 鉴权、标签切换、boot() 等核心逻辑保持不变（此处简化展示，实际请保留你原来的完整脚本）
document.getElementById('auth-btn').addEventListener('click', async () => { /* ...你的鉴权代码... */ });

async function boot() {
  try {
    CFG = await fetch(WORKER + '/api/config').then(r => r.json());
  } catch(e) {}

  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  buildChannels();
}

// ==================== 频道发布页面核心函数（已添加介绍文字） ====================
function buildChannels() {
  const wrap = document.getElementById('channels-wrap');
  wrap.innerHTML = '';

  const sendable = CFG.channels.filter(c => c.canSend);
  const readonly = CFG.channels.filter(c => !c.canSend);

  // 可发布频道
  if (sendable.length) {
    const title = document.createElement('div');
    title.className = 'ch-section-title';
    title.textContent = '📤 可发布频道';
    wrap.appendChild(title);

    sendable.forEach(ch => {
      const sid = safeId(ch.id);
      const card = document.createElement('div');
      card.className = 'ch-card';
      card.innerHTML = `
        <div class="ch-card-head">
          <div class="avatar" style="background:rgba(63,185,80,.15);color:var(--green);font-size:1rem">📢</div>
          <div class="info">
            <strong>${esc(ch.name)}</strong>
            <span>${esc(ch.id)}</span>
          </div>
          <span class="badge-green">可发布</span>
        </div>
        <div class="ch-send-area">
          <textarea id="cht-${sid}" placeholder="输入要发布到「${esc(ch.name)}」的内容…"></textarea>
          <div class="ch-send-btn-row">
            <button class="btn btn-green" onclick="sendCh('${ch.id}','${sid}')">📤 发布到频道</button>
          </div>
        </div>`;
      wrap.appendChild(card);
    });
  }

  // 仅监控频道 + 新增介绍文字
  if (readonly.length) {
    const title = document.createElement('div');
    title.className = 'ch-section-title';
    title.style.marginTop = sendable.length ? '24px' : '8px';
    title.textContent = '📡 其他关注频道（点击打开）';
    wrap.appendChild(title);

    // === 新增：频道总体介绍文字 ===
    const intro = document.createElement('div');
    intro.className = 'ch-intro';
    intro.innerHTML = `
      点击卡片会跳转新标签页<br>
      在tg频道链接的t.me/后加s/<br>
      再前往此链接可浏览频道内容<br>

    `;
    wrap.appendChild(intro);

    // 只读频道卡片
    readonly.forEach(ch => {
      const a = document.createElement('a');
      a.className = 'ch-card-link';
      a.href = tgUrl(ch.id);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="ch-link-body">
          <div class="avatar" style="background:var(--surface2);font-size:1rem">📡</div>
          <div class="ch-link-info">
            <strong>${esc(ch.name)}</strong>
            <div class="ch-link-url">${tgUrl(ch.id)}</div>
            <div class="ch-link-hint">点击在 Telegram 网页端查看频道</div>
          </div>
          <div class="ch-link-arrow">→</div>
        </div>`;
      wrap.appendChild(a);
    });
  }

  // 无频道时的空状态
  if (!sendable.length && !readonly.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.style.paddingTop = '80px';
    empty.innerHTML = `<div class="empty-icon">📢</div><div>暂无配置任何频道</div>`;
    wrap.appendChild(empty);
  }
}

async function sendCh(chatId, sid) {
  const ta = document.getElementById('cht-' + sid);
  if (!ta || !ta.value.trim()) {
    toast('⚠️ 请输入发布内容', false);
    return;
  }
  // 这里接回你原来的发送逻辑
  toast('✅ 发布功能已触发（请接回实际API）');
}
</script>
</body>
</html>
