<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TG 桥接控制台</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2128;
            --surface3: #21262d;
            --border: #2d333b;
            --border2: #373e47;
            --accent: #79c0ff;
            --accent2: #388bfd;
            --accent3: #1158c7;
            --text: #cdd9e5;
            --text2: #adbac7;
            --muted: #768390;
            --green: #57ab5a;
            --green2: #347d39;
            --red: #e5534b;
            --sent-bg: #143a6e;
            --recv-bg: #1c2128;
            --contact-bg: #1a2035;
            --radius-sm: 8px;
            --radius: 14px;
            --radius-lg: 18px;
            --radius-xl: 22px;
            --anim: 180ms cubic-bezier(.4, 0, .2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── 壁纸层 ── */
        #bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #bg-layer.loaded {
            opacity: 1;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            /* 调亮：透明度 0.35 */
            background: rgba(13, 17, 23, 0.35);
            /* 移除模糊：0px 确保清晰 */
            backdrop-filter: blur(0px);
            z-index: 1;
        }

        /* ── 主内容容器 ── */
        #auth-screen, #app {
            position: relative;
            z-index: 2;
        }

        /* ── 登录界面 ── */
        #auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .auth-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid var(--border2);
            border-radius: var(--radius-xl);
            padding: 38px 30px 32px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
        }

        .auth-logo {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .auth-card h1 {
            font-size: 1.25rem;
            margin-bottom: 4px;
            color: var(--text);
            font-weight: 700;
        }

        .auth-card p {
            color: var(--muted);
            font-size: .84rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: .7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 10px 14px;
            font-size: .93rem;
            outline: none;
            transition: border-color var(--anim), box-shadow var(--anim);
        }

        .field input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(56, 139, 253, .18);
        }

        /* ── 按钮基础 ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--accent2);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            font-size: .88rem;
            cursor: pointer;
            font-weight: 600;
            transition: background var(--anim), transform 80ms ease, box-shadow var(--anim);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: background 80ms ease;
        }

        .btn.tap-active::after {
            background: rgba(255, 255, 255, .18);
        }

        .btn:hover {
            background: var(--accent);
            box-shadow: 0 4px 14px rgba(56, 139, 253, .3);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:disabled {
            opacity: .42;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-full {
            width: 100%;
            margin-top: 6px;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: .76rem;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-red {
            background: var(--red);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border2);
        }

        .btn-green {
            background: var(--green2);
        }

        /* ── App 框架 ── */
        #app {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: rgba(22, 27, 34, 0.85);
            border-bottom: 1px solid var(--border);
            gap: 10px;
            flex-shrink: 0;
            backdrop-filter: blur(16px);
        }

        .app-header .title {
            flex: 1;
            font-size: .94rem;
            font-weight: 700;
        }

        /* ── 标签页 ── */
        .tabs {
            display: flex;
            background: rgba(22, 27, 34, 0.80);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            backdrop-filter: blur(16px);
        }

        .tab {
            flex: 1;
            padding: 11px 6px;
            text-align: center;
            font-size: .76rem;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--anim);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(56, 139, 253, .06);
            font-weight: 700;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        /* ── 聊天布局 & 亮度统一 ── */
        .chat-layout {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .chat-list {
            width: 226px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            background: rgba(22, 27, 34, 0.40); /* 统一左侧透明度 */
            backdrop-filter: blur(8px);
        }

        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            background: rgba(13, 17, 23, 0.30); /* 统一右侧透明度 */
            backdrop-filter: blur(4px);
        }

        /* ── 频道页面亮度统一 ── */
        .channels-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 200px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(13, 17, 23, 0.25);
        }

        .ch-card {
            background: rgba(22, 27, 34, 0.65); /* 调亮频道卡片 */
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
        }

        .ch-card-link {
            display: block;
            background: rgba(22, 27, 34, 0.60);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(8px);
        }

        /* ── 聊天元素 ── */
        .chat-item {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-item.active {
            background: rgba(56, 139, 253, .10);
            border-left: 3px solid var(--accent2);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--accent3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .76rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bubble {
            max-width: 76%;
            padding: 8px 13px;
            border-radius: var(--radius);
            font-size: .85rem;
            line-height: 1.55;
            word-break: break-word;
        }

        .bubble-sent {
            align-self: flex-end;
            background: var(--sent-bg);
            border: 1px solid rgba(56, 139, 253, .18);
        }

        .bubble-recv {
            align-self: flex-start;
            background: var(--recv-bg);
            border: 1px solid var(--border);
        }

        .send-bar {
            padding: 9px 12px;
            background: rgba(22, 27, 34, 0.85);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 9px;
            backdrop-filter: blur(12px);
        }

        .send-bar textarea {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            color: var(--text);
            padding: 8px 13px;
            font-size: .87rem;
            resize: none;
            outline: none;
        }

        #toast {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 10px 20px;
            border-radius: var(--radius);
            z-index: 9999;
            opacity: 0;
            transition: all .25s;
            backdrop-filter: blur(20px);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── 隐藏控制 ── */
        .hide { display: none !important; }
        @media (max-width: 580px) {
            .chat-list { width: 100%; }
            .chat-list.hide { display: none; }
            .chat-view.hide { display: none; }
            .back-btn { display: block !important; }
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">🔗</div>
            <h1>TG 桥接控制台</h1>
            <p>输入 Cloudflare Worker 地址和访问密钥</p>
            <div class="field">
                <label>Worker 地址</label>
                <input id="inp-url" type="url" placeholder="https://xxx.workers.dev" autocomplete="off">
            </div>
            <div class="field">
                <label>访问密钥</label>
                <input id="inp-key" type="password" placeholder="输入密钥">
            </div>
            <button class="btn btn-full" id="auth-btn">进入控制台 →</button>
            <div class="err" id="auth-err" style="display:none; color:var(--red); margin-top:10px; font-size:.82rem;"></div>
        </div>
    </div>

    <div id="app">
        <div class="app-header">
            <span class="title">🔗 TG 桥接控制台</span>
            <button class="btn btn-sm btn-red" id="logout-btn">退出</button>
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="private">🔒 私密群组</div>
            <div class="tab" data-tab="public">🌐 公开群组</div>
            <div class="tab" data-tab="contacts">👤 联系人</div>
            <div class="tab" data-tab="channels">📢 频道</div>
        </div>

        <div class="tab-content active" id="tab-private">
            <div class="chat-layout">
                <div class="chat-list" id="list-private"></div>
                <div class="chat-view" id="view-private">
                    <div class="empty-state" style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:var(--muted);">
                        <span style="font-size:3rem;">💬</span>
                        <p>请选择一个聊天</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-public">
            <div class="chat-layout">
                <div class="chat-list" id="list-public"></div>
                <div class="chat-view" id="view-public"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-contacts">
            <div class="chat-layout">
                <div class="chat-list" id="list-contacts"></div>
                <div class="chat-view" id="view-contacts"></div>
            </div>
        </div>

        <div class="tab-content" id="tab-channels">
            <div class="channels-wrap" id="channels-wrap"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let WORKER = '';
        let KEY = '';
        let CFG = { private: [], public: [], channels: [], contacts: [] };
        let timers = {};

        // 初始化背景
        (function initBg() {
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;
            const imgFile = isMobile ? 'f1.jpg' : 'f2.jpg';
            const bg = document.getElementById('bg-layer');
            const img = new Image();
            img.onload = () => {
                bg.style.backgroundImage = `url('${imgFile}')`;
                bg.classList.add('loaded');
            };
            img.src = imgFile;
        })();

        // 工具函数
        const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        const initials = name => name.replace(/[\s（()【[\]】@]/g, '').slice(0, 2).toUpperCase() || '??';
        const safeId = id => String(id).replace(/[^a-z0-9]/gi, '_');

        async function api(path, opts = {}) {
            const r = await fetch(WORKER + path, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${KEY}`,
                    ...(opts.headers || {}),
                },
            });
            return r.json();
        }

        function toast(msg, ok = true) {
            const el = document.getElementById('toast');
            el.innerHTML = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2800);
        }

        function tapBtn(btn, cb) {
            if (btn.disabled) return;
            btn.classList.add('tap-active');
            setTimeout(() => {
                btn.classList.remove('tap-active');
                cb();
            }, 140);
        }

        // 身份验证逻辑
        const savedUrl = localStorage.getItem('wUrl') || '';
        if (savedUrl) document.getElementById('inp-url').value = savedUrl;

        document.getElementById('auth-btn').onclick = function() {
            tapBtn(this, async () => {
                const url = document.getElementById('inp-url').value.trim().replace(/\/$/, '');
                const key = document.getElementById('inp-key').value.trim();
                if (!url || !key) return;
                
                try {
                    const res = await fetch(url + '/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key }),
                    });
                    const data = await res.json();
                    if (data.ok) {
                        WORKER = url; KEY = key;
                        localStorage.setItem('wUrl', url);
                        sessionStorage.setItem('sk', key);
                        boot();
                    } else {
                        document.getElementById('auth-err').textContent = '密钥错误';
                        document.getElementById('auth-err').style.display = 'block';
                    }
                } catch (e) {
                    document.getElementById('auth-err').textContent = '连接失败';
                    document.getElementById('auth-err').style.display = 'block';
                }
            });
        };

        document.getElementById('logout-btn').onclick = () => {
            sessionStorage.removeItem('sk');
            location.reload();
        };

        // 标签切换
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = function() {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            };
        });

        // 启动应用
        async function boot() {
            try {
                CFG = await api('/api/config');
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                renderLists();
            } catch (e) { toast('配置加载失败', false); }
        }

        function renderLists() {
            buildList('list-private', CFG.private, 'view-private', 'private');
            buildList('list-public', CFG.public, 'view-public', 'public');
            buildContactList();
            buildChannels();
        }

        function buildList(listId, chats, viewId, type) {
            const list = document.getElementById(listId);
            list.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="openChat('${listId}','${viewId}',${JSON.stringify(chat).replace(/"/g, '&quot;')},'${type}')">
                    <div class="avatar">${initials(chat.name)}</div>
                    <div>
                        <div class="chat-name">${esc(chat.name)}</div>
                        <div class="chat-name-sub">${esc(chat.id)}</div>
                    </div>
                </div>
            `).join('');
        }

        function buildContactList() {
            const list = document.getElementById('list-contacts');
            if (!CFG.contacts) return;
            list.innerHTML = CFG.contacts.map(c => `
                <div class="chat-item" onclick="openChat('list-contacts','view-contacts',${JSON.stringify(c).replace(/"/g, '&quot;')},'contacts')">
                    <div class="avatar" style="background:var(--green2)">${initials(c.name)}</div>
                    <div>
                        <div class="chat-name">${esc(c.name)}</div>
                        <div class="chat-name-sub">ID: ${c.id}</div>
                    </div>
                </div>
            `).join('');
        }

        function openChat(listId, viewId, chat, type) {
            const view = document.getElementById(viewId);
            const sid = safeId(chat.id);
            view.innerHTML = `
                <div class="chat-view-header" style="padding:10px 14px; background:rgba(22,27,34,0.75); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;">
                    <div class="chat-view-title" style="font-weight:700;">${esc(chat.name)}</div>
                    <button class="btn btn-sm btn-ghost" onclick="clearChat('${chat.id}')">清空</button>
                </div>
                <div class="messages" id="msgs-${sid}"></div>
                <div class="send-bar">
                    <textarea id="ta-${sid}" placeholder="输入消息..."></textarea>
                    <button class="btn" onclick="doSend('${chat.id}','${sid}')">发送</button>
                </div>
            `;
            fetchMsgs(chat.id);
            if (timers[type]) clearInterval(timers[type]);
            timers[type] = setInterval(() => fetchMsgs(chat.id), 5000);
        }

        async function fetchMsgs(chatId) {
            const sid = safeId(chatId);
            const box = document.getElementById('msgs-' + sid);
            if (!box) return;
            const msgs = await api('/api/messages?chatId=' + encodeURIComponent(chatId));
            const html = msgs.slice().reverse().map(m => {
                const sent = (m.from || '').includes('【Web发送】');
                return `<div class="bubble ${sent ? 'bubble-sent' : 'bubble-recv'}">
                    ${!sent ? `<div style="font-size:0.7rem; color:var(--accent); margin-bottom:3px;">${esc(m.from)}</div>` : ''}
                    <div class="bubble-text">${esc(m.text)}</div>
                </div>`;
            }).join('');
            if (box.innerHTML !== html) box.innerHTML = html;
        }

        async function doSend(chatId, sid) {
            const ta = document.getElementById('ta-' + sid);
            const text = ta.value.trim();
            if (!text) return;
            const r = await api('/api/send', { method: 'POST', body: JSON.stringify({ chatId, text }) });
            if (r.ok) { ta.value = ''; fetchMsgs(chatId); }
        }

        async function clearChat(chatId) {
            await api('/api/clear', { method: 'POST', body: JSON.stringify({ chatId }) });
            fetchMsgs(chatId);
        }

        function buildChannels() {
            const wrap = document.getElementById('channels-wrap');
            wrap.innerHTML = (CFG.channels || []).map(ch => `
                <div class="ch-card" style="padding:15px; margin-bottom:10px;">
                    <div style="font-weight:700; margin-bottom:10px;">${esc(ch.name)}</div>
                    ${ch.canSend ? `
                        <textarea id="cht-${safeId(ch.id)}" style="width:100%; height:60px; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:8px;"></textarea>
                        <button class="btn btn-sm btn-green" style="margin-top:8px;" onclick="sendCh('${ch.id}','${safeId(ch.id)}')">发布</button>
                    ` : `<a href="https://t.me/${ch.id.replace('@','')}" target="_blank" class="ch-card-link" style="padding:8px; text-align:center;">在 TG 中查看</a>`}
                </div>
            `).join('');
        }

        async function sendCh(chatId, sid) {
            const ta = document.getElementById('cht-' + sid);
            const text = ta.value.trim();
            if (!text) return;
            const r = await api('/api/send', { method: 'POST', body: JSON.stringify({ chatId, text }) });
            if (r.ok) { ta.value = ''; toast('发布成功'); }
        }

        // 自动登录
        const sk = sessionStorage.getItem('sk');
        const wu = localStorage.getItem('wUrl');
        if (sk && wu) { WORKER = wu; KEY = sk; boot(); }
    </script>
</body>
</html>
